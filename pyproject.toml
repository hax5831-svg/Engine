[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-engine"
version = "1.0.0"
description = "A 10-cylinder aircraft piston engine simulator rendered entirely in the terminal."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aero-engine = "aero_engine.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
